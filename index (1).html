    <!-- Firebase konfiguracja -->
    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
      import {
        getFirestore,
        collection,
        getDocs,
        addDoc,
        updateDoc,
        deleteDoc,
        doc,
        query,
        where,
      } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

       import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';

      const firebaseConfig = {
        apiKey: 'AIzaSyAqcfDp9d9uziGGZfC9wM9ieAPOVn_Vh1k',
        authDomain: 'kontrola-jakosci-5c5ad.firebaseapp.com',
        projectId: 'kontrola-jakosci-5c5ad',
        storageBucket: 'kontrola-jakosci-5c5ad.firebasestorage.app',
        messagingSenderId: '1058209207909',
        appId: '1:1058209207909:web:0651b02ce8294ccd82988c',
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
        const auth = getAuth(app); // NOWE - tylko ta linijka


      class FirebaseDataManager {
        constructor(firestore) {
          this.db = firestore;
        }

        async getData(collectionName) {
          try {
            const querySnapshot = await getDocs(
              collection(this.db, collectionName)
            );
            return querySnapshot.docs.map((doc) => ({
              id: doc.id,
              ...doc.data(),
            }));
          } catch (error) {
            console.error(`Błąd pobierania ${collectionName}:`, error);
            return [];
          }
        }

        async addData(collectionName, data) {
          try {
            const docRef = await addDoc(
              collection(this.db, collectionName),
              data
            );
            return { id: docRef.id, ...data };
          } catch (error) {
            console.error(`Błąd dodawania do ${collectionName}:`, error);
            throw error;
          }
        }

        async updateData(collectionName, id, data) {
          try {
            const docRef = doc(this.db, collectionName, id);
            await updateDoc(docRef, data);
            return { id, ...data };
          } catch (error) {
            console.error(`Błąd aktualizacji ${collectionName}:`, error);
            throw error;
          }
        }

        async deleteData(collectionName, id) {
          try {
            const docRef = doc(this.db, collectionName, id);
            await deleteDoc(docRef);
          } catch (error) {
            console.error(`Błąd usuwania z ${collectionName}:`, error);
            throw error;
          }
        }

        async deleteBatch(collectionName, ids) {
          try {
            const deletePromises = ids.map((id) =>
              this.deleteData(collectionName, id)
            );
            await Promise.all(deletePromises);
          } catch (error) {
            console.error('Błąd usuwania batch:', error);
            throw error;
          }
        }

        async moveData(fromCollection, toCollection, id, additionalData = {}) {
          try {
            const sourceData = await this.getData(fromCollection);

      const componentKey = (name) => String(name || '').normalize('NFC').trim().replace(/\s+/g, ' ').toLocaleLowerCase('pl');
      const sortComponents = (items) => [...items].sort((a, b) =>
        Number(/^\d/.test(a.name.trim())) - Number(/^\d/.test(b.name.trim())) ||
        a.name.localeCompare(b.name, 'pl', { numeric: true, sensitivity: 'base' }));
      const matchesComponent = (item, name) => [item.name, ...(item.aliases || [])].some(value => componentKey(value) === componentKey(name));
      // Merge definitions only. Historical defects retain their names and all data.
      const mergeComponents = async (items) => {
        const groups = new Map();
        for (const item of items) {
          const key = componentKey(item.name);
          groups.set(key, [...(groups.get(key) || []), item]);
        }
        const result = [];
        for (const group of groups.values()) {
          group.sort((a, b) => a.id.localeCompare(b.id));
          const primary = group[0];
          if (group.length > 1) {
            const fields = [];
            for (const item of group) for (const field of item.fields || []) {
              if (!fields.some(f => f.name === field.name && f.type === field.type)) fields.push(field);
            }
            const aliases = [...new Set(group.flatMap(item => [item.name, ...(item.aliases || [])]))];
            const merged = { fields, aliases };
            // Persist the union before deleting redundant definitions; retries are safe.
            await window.dataManager.updateData('components', primary.id, merged);
            Object.assign(primary, merged);
            for (const duplicate of group.slice(1)) await window.dataManager.deleteData('components', duplicate.id);
          }
          result.push(primary);
        }
        return sortComponents(result);
      };

>
  <i className="fas fa-sign-out-alt text-xl"></i>
</button>

              </div>

            <div className="container mx-auto p-4 md:p-6">

              {page === 'add' && (

            {/* Delete Modal */}
            {showDeleteModal && (
              <div

                onClick={() => setShowDeleteModal(false)}
              >
                <div

                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="text-center">
                    <i className="fas fa-trash-alt text-4xl md:text-6xl text-red-500 mb-4"></i>
                    <h3 className="text-xl md:text-2xl font-bold mb-2">
                      Potwierdzenie usunięcia
                    </h3>
                    <p className="text-gray-600 mb-6 text-sm md:text-base">
                      Czy na pewno chcesz usunąć{' '}
                      <strong>{selectedForDeletion.size}</strong> wybranych
                      centrali z archiwum?
                    </p>
                    <div className="flex justify-center space-x-4">
                      <button
                        onClick={() => setShowDeleteModal(false)}

                      >
                        Anuluj
                      </button>
                      <button
                        onClick={handleDeleteSelected}
                        className="px-4 md:px-6 py-2 md:py-3 bg-gradient-to-r from-red-500 to-red-600 text-white rounded-full hover:from-red-600 hover:to-red-700 transition-all duration-300 text-sm md:text-base"
                      >
                        Usuń
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Restore Modal */}
            {showRestoreModal && (
              <div
                className="modal-overlay"
                onClick={() => setShowRestoreModal(false)}
              >
                <div
                  className="modal-content"
                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="text-center">
                    <i className="fas fa-undo text-4xl md:text-6xl text-green-500 mb-4"></i>
                    <h3 className="text-xl md:text-2xl font-bold mb-2">
                      Potwierdzenie przywrócenia
                    </h3>
                    <p className="text-gray-600 mb-6 text-sm md:text-base">
                      Czy na pewno chcesz przywrócić{' '}
                      <strong>{selectedForRestore.size}</strong> wybranych
                      centrali do listy braków?
                    </p>
                    <div className="flex justify-center space-x-4">
                      <button
                        onClick={() => setShowRestoreModal(false)}
                        className="px-4 md:px-6 py-2 md:py-3 border-2 border-gray-300 rounded-full hover:bg-gray-50 transition-all duration-300 text-sm md:text-base"
                      >
                        Anuluj
                      </button>
                      <button
                        onClick={handleRestoreSelected}
                        className="px-4 md:px-6 py-2 md:py-3 bg-gradient-to-r from-green-500 to-green-600 text-white rounded-full hover:from-green-600 hover:to-green-700 transition-all duration-300 text-sm md:text-base"
                      >
                        Przywróć
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      // AddDefect pozostaje bez zmian z poprzedniej wersji
      const normalizeUnitNumber = (value) => String(value || '').trim().toUpperCase();
      const AutoTextarea = (props) => {
        const ref = useRef(null);
        useEffect(() => {
          const resize = () => { if (ref.current) { ref.current.style.height = 'auto'; ref.current.style.height = ref.current.scrollHeight + 'px'; } };
          resize();
          window.addEventListener('resize', resize);
          return () => window.removeEventListener('resize', resize);
        }, [props.value]);
        return <textarea {...props} ref={ref} style={{width: '100%', overflow: 'hidden', ...props.style}} />;
      };
      const DefectDialog = ({ onClose, children }) => {
        const dialogRef = useRef(null);
        useEffect(() => {
          const dialog = dialogRef.current;
          const previousFocus = document.activeElement;
          const previousOverflow = document.body.style.overflow;
          dialog.showModal();
          document.body.style.overflow = 'hidden';
          return () => {
            dialog.close();
            document.body.style.overflow = previousOverflow;
            if (previousFocus?.isConnected) previousFocus.focus({ preventScroll: true });
          };
        }, []);
        return ReactDOM.createPortal(
          <dialog ref={dialogRef} aria-label="Formularz braku" onCancel={event => { event.preventDefault(); onClose(); }}
            className="defect-dialog">
            <div className="defect-dialog-toolbar">
              <button type="button" autoFocus aria-label="Zamknij formularz" title="Zamknij (Esc)" onClick={onClose} className="defect-dialog-close">×</button>
            </div>
            {children}
          </dialog>, document.body);
      };

      const AddDefect = ({ units, setUnits, components, initialDefect = null, initialUnitNumber = '', onDone, onDelete, deleting = false }) => {
        const [unitNumber, setUnitNumber] = useState(initialDefect?.unitNumber || initialUnitNumber);
        const [component, setComponent] = useState(initialDefect?.component || '');
        const [componentSearch, setComponentSearch] = useState('');
        const [deliveryDate, setDeliveryDate] = useState(initialDefect?.deliveryDate || '');
        const [fields, setFields] = useState(initialDefect?.fields || {});
        const [saving, setSaving] = useState(false);
        const mobile = isMobile();
          const [comment, setComment] = useState(initialDefect?.comment || ''); // NOWE - komentarz

          // NOWE - stan logowania (te linii brakowało!)
    


        const handleAdd = async () => {
          if (!normalizeUnitNumber(unitNumber) || !component || saving || deleting) return;

          setSaving(true);
          try {
            const newDefect = {
  unitNumber: normalizeUnitNumber(unitNumber),
  component,
  fields,
  deliveryDate,
  comment: comment || '', // NOWE - dodaj komentarz
  completed: initialDefect?.completed || false,
  dateAdded: initialDefect?.dateAdded || new Date().toISOString(),
};


            if (initialDefect) {
              await window.dataManager.updateData('units', initialDefect.id, newDefect);
              setUnits(prev => prev.map(item => item.id === initialDefect.id ? {...item, ...newDefect} : item));
            } else {
              const addedDefect = await window.dataManager.addData('units', newDefect);
              setUnits(prev => [...prev, addedDefect]);
            }
            if (onDone) onDone();
            setUnitNumber('');
            setComponent('');
            setComponentSearch('');
            setDeliveryDate('');
            setFields({});
            setComment('');

            showConfetti();
            showToast('🎉 Brak został dodany pomyślnie!', 'success');
          } catch (error) {
            showToast('❌ Błąd dodawania braku', 'error');
          } finally {
            setSaving(false);
          }
        };

        return (
          <div className="glass-card transform hover:scale-105 transition-all duration-300">
            <div className="flex items-center mb-6 md:mb-8">
              <div className="w-12 h-12 md:w-16 md:h-16 bg-gradient-to-br from-orange-400 to-red-500 rounded-xl md:rounded-2xl flex items-center justify-center mr-4 md:mr-6">
                <i className="fas fa-plus text-lg md:text-2xl text-white"></i>
              </div>
              <div>
                <h2 className="text-xl md:text-3xl font-bold text-gray-800">
                  {initialDefect ? 'Edytuj brak' : 'Dodaj Nowy Brak'}
                </h2>
                <p className="text-sm md:text-base text-gray-600">
                  Wprowadź szczegóły centrali wentylacyjnej
                </p>
              </div>
            </div>

            <div className="form-grid grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-8">
              <div className="space-y-2 md:space-y-3">
                <label className="form-label">NUMER CENTRALI</label>
                <input
                  type="text"
                  placeholder="np. CEN-001"
                  value={unitNumber}
                  onChange={(e) => setUnitNumber(e.target.value)}
                  className="form-input"
                  list="unitNumbers"
                />
                <datalist id="unitNumbers">
                  {[
                    ...new Set(
                      units
                        .map((u) => u.unitNumber)
                        .concat(['CEN-001', 'CEN-002', 'CEN-003'])
                    ),
                  ].map((num) => (
                    <option key={num} value={num} />
                  ))}
                </datalist>
              </div>

              <div className="space-y-2 md:space-y-3">
                <label className="form-label">KOMPONENT</label>
                <input type="search" aria-label="Szukaj komponentu" placeholder="Szukaj komponentu..." className="form-input" value={componentSearch} onChange={e => setComponentSearch(e.target.value)} />
                <div className="border rounded-lg overflow-y-auto max-h-60" role="group" aria-label="Lista komponentów">
                  {sortComponents(components).filter(comp => comp.name.toLowerCase().includes(componentSearch.trim().toLowerCase())).map(comp => (
                    <button type="button" key={comp.name} aria-pressed={component === comp.name}
                      className={`block w-full text-left px-3 py-2 border-b ${component === comp.name ? 'bg-orange-100 text-orange-800 font-bold' : 'bg-white hover:bg-gray-100'}`}
                      onClick={() => { if (component !== comp.name) { setComponent(comp.name); setFields({}); } }}>
                      {comp.name}{component === comp.name ? ' ✓' : ''}
                    </button>
                  ))}
                  {!components.some(comp => comp.name.toLowerCase().includes(componentSearch.trim().toLowerCase())) &&
                    <p className="p-3 text-gray-500">Nie znaleziono komponentów</p>}
                </div>
                {component && <p className="text-sm text-gray-600">Wybrany komponent: {component}</p>}
              </div>

              {component &&
                components
                  .find((c) => matchesComponent(c, component))
                  ?.fields.map((field) => (
                    <div key={field.name} className="space-y-2 md:space-y-3">
                      <label className="form-label">
                        {field.name.toUpperCase()}
                      </label>
                      <input
                        type={field.type}
                        placeholder={`Wprowadź ${field.name.toLowerCase()}`}
                        value={fields[field.name] || ''}
                        onChange={(e) =>
                          setFields({ ...fields, [field.name]: e.target.value })
                        }
                        className="form-input"
                      />
                    </div>
                  ))}
              <div className="space-y-2">
                <label className="form-label" htmlFor="delivery-date">Przewidywany czas dostawy (opcjonalnie)</label>
                <input id="delivery-date" type="date" className="form-input" value={deliveryDate} onChange={e => setDeliveryDate(e.target.value)} />
                {deliveryDate && <button type="button" className="text-orange-700" onClick={() => setDeliveryDate('')}>Usuń termin</button>}
              </div>
                                {/* NOWE - Pole komentarza */}
              <div className="space-y-2 md:space-y-3 md:col-span-2">
                <label className="form-label">KOMENTARZ (OPCJONALNIE)</label>
                <AutoTextarea
                  placeholder="Dodaj komentarz do braku..."
                  value={comment}
                  onChange={(e) => setComment(e.target.value)}
                  className="form-input min-h-[80px] resize-none"
                  rows="3"
                />
              </div>

            </div>

            <button
              onClick={handleAdd}
              disabled={saving || deleting || !normalizeUnitNumber(unitNumber) || !component}
              className="mt-6 md:mt-8 w-full btn-primary"
            >
              {saving ? (
                <>
                  <i className="fas fa-spinner fa-spin mr-2"></i>
                  Zapisywanie...
                </>
              ) : (
                <>
                  <i className="fas fa-plus mr-2"></i>
                  {initialDefect ? 'Zapisz zmiany' : 'Dodaj Brak'}
                </>
              )}
            </button>
            {initialDefect && onDelete && <div className="mt-6 border-t border-gray-200 pt-4">
              <button type="button" disabled={saving || deleting} onClick={onDelete}
                className="text-red-700 border border-red-300 rounded-lg px-4 py-2 hover:bg-red-50 disabled:opacity-50">
                {deleting ? 'Usuwanie...' : 'Usuń brak'}
              </button>
            </div>}

          </div>
        );
      };

      // DefectList pozostaje bez zmian z poprzedniej wersji
      // DefectList – lista braków (zawsze rozwinięta)
// DefectList – lista braków z sortowaniem i edycją komentarzy
const DefectList = ({
  units,
  setUnits,
  setArchivedUnits,
  components,
}) => {
  const [searchQuery, setSearchQuery] = useState('');
  const [sortBy, setSortBy] = useState('number');
  const [tempUnits, setTempUnits] = useState(units);
  const [updating, setUpdating] = useState(false);
  const [defectEditor, setDefectEditor] = useState(null);
  const [editingComment, setEditingComment] = useState(null);
  const [editCommentValue, setEditCommentValue] = useState('');
  const mobile = isMobile();

  useEffect(() => {
    setTempUnits(units);
  }, [units]);

  const handleEditComment = (defectId, currentComment) => {
    setEditingComment(defectId);
    setEditCommentValue(currentComment || '');
  };

  const handleSaveComment = async (defectId) => {
    try {
      await window.dataManager.updateData('units', defectId, {
        comment: editCommentValue,
      });
      const updatedUnits = tempUnits.map(unit =>
        unit.id === defectId ? { ...unit, comment: editCommentValue } : unit
      );
      setTempUnits(updatedUnits);
      setUnits(updatedUnits);
      setEditingComment(null);
      setEditCommentValue('');
      showToast('💬 Komentarz zaktualizowany!', 'success');
    } catch (error) {
      showToast('❌ Błąd aktualizacji komentarza', 'error');
    }
  };

  const handleCancelEdit = () => {
    setEditingComment(null);
    setEditCommentValue('');
  };

  const getFilteredUnitNumbers = () => {
    const uniqueNumbers = [...new Set(units.map((u) => u.unitNumber))];
    return uniqueNumbers.filter((num) =>
      num.toLowerCase().includes(searchQuery.toLowerCase())
    );
  };

  const getUnitData = () => {
    const unitMap = new Map();
    units.forEach((unit) => {
      const existing = unitMap.get(unit.unitNumber);
      const date = new Date(unit.dateAdded);
      if (!existing) {
        unitMap.set(unit.unitNumber, {
          unitNumber: unit.unitNumber,
          minDate: date,
          maxDate: date,
        });
      } else {
        if (date < existing.minDate) existing.minDate = date;
        if (date > existing.maxDate) existing.maxDate = date;
      }
    });
    return Array.from(unitMap.values());
  };

  const getSortedUnitNumbers = () => {
    const filtered = getFilteredUnitNumbers();
    if (sortBy === 'number') {
      return filtered.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
    } else {
      const unitData = getUnitData().filter((u) => filtered.includes(u.unitNumber));
      if (sortBy === 'oldest') {
        return unitData.sort((a, b) => a.minDate - b.minDate).map((u) => u.unitNumber);
      } else {
        return unitData.sort((a, b) => b.maxDate - a.maxDate).map((u) => u.unitNumber);
      }
    }
  };

  const sortedUnits = getSortedUnitNumbers();
  const deleteLock = useRef(false);
  const [deletingId, setDeletingId] = useState(null);
  const handleDeleteDefect = async (defect) => {
    if (deleteLock.current || updating) return;
    if (!window.confirm(`Usunąć brak „${defect.component}” z centrali ${defect.unitNumber}? Tej operacji nie można cofnąć.`)) return;
    deleteLock.current = true;
    setDeletingId(defect.id);
    try {
      await window.dataManager.deleteData('units', defect.id);
      setUnits(prev => prev.filter(item => item.id !== defect.id));
      setTempUnits(prev => prev.filter(item => item.id !== defect.id));
      if (defectEditor?.id === defect.id) setDefectEditor(null);
      if (editingComment === defect.id) setEditingComment(null);
      showToast('Brak został usunięty', 'success');
    } catch (error) {
      showToast('Nie udało się usunąć braku. Spróbuj ponownie.', 'error');
    } finally {
      deleteLock.current = false;
      setDeletingId(null);
    }
  };

  const handleCheckboxChange = async (defectId, checked) => {
    if (updating || deleteLock.current) return;
    setUpdating(true);
    try {
      await window.dataManager.updateData('units', defectId, { completed: checked });
      setUnits(prev => prev.map(item => item.id === defectId ? { ...item, completed: checked } : item));
      setTempUnits(prev => prev.map(item => item.id === defectId ? { ...item, completed: checked } : item));
    } catch (error) {
      showToast('Nie udało się zapisać statusu. Spróbuj ponownie.', 'error');
    } finally { setUpdating(false); }
  };

  const handleConfirm = async (unitNumber) => {
    if (updating || deleteLock.current) return;
    setUpdating(true);
    try {
      const unitsToUpdate = tempUnits.filter((u) => u.unitNumber === unitNumber);
      for (const unit of unitsToUpdate) {
        await window.dataManager.updateData('units', unit.id, { completed: unit.completed });
      }
      setUnits(tempUnits);

      const completedUnits = unitsToUpdate.filter((u) => u.completed);
      if (completedUnits.length === unitsToUpdate.length) {
        for (const unit of completedUnits) {
          await window.dataManager.moveData('units', 'archivedUnits', unit.id, {
            dateCompleted: new Date().toISOString(),
          });
        }
        const remainingUnits = tempUnits.filter((u) => u.unitNumber !== unitNumber);
        setUnits(remainingUnits);
        setTempUnits(remainingUnits);
        const archivedData = await window.dataManager.getData('archivedUnits');
        setArchivedUnits(archivedData.map(u => ({...u, unitNumber: normalizeUnitNumber(u.unitNumber)})));
        showConfetti();
        showToast(`🎉 Centrala ${unitNumber} została zarchiwizowana!`, 'success');
      } else {
        showToast('✅ Zaktualizowano status braków', 'success');
      }
    } catch (error) {
      showToast('❌ Błąd aktualizacji', 'error');
    } finally {
      setUpdating(false);
    }
  };

  return (
    <div className="glass-card p-3 md:p-4">
      <div className="flex items-center justify-between flex-wrap gap-2 mb-3 md:mb-4">
        <div className="flex items-center">
          <div className="w-8 h-8 md:w-10 md:h-10 bg-gradient-to-br from-blue-400 to-purple-500 rounded-lg flex items-center justify-center mr-2 md:mr-3">
            <i className="fas fa-list text-sm md:text-base text-white"></i>
          </div>
          <div>
            <h2 className="text-base md:text-xl font-bold text-gray-800">Lista Braków</h2>
            <p className="text-xs text-gray-500">Wszystkie szczegóły widoczne od razu</p>
          </div>
        </div>
        <div className="flex items-center space-x-2">
          <i className="fas fa-sort text-gray-400 text-sm"></i>
          <select
            value={sortBy}
            onChange={(e) => setSortBy(e.target.value)}
            className="text-xs border border-gray-300 rounded-lg px-2 py-1 bg-white focus:outline-none focus:ring-1 focus:ring-orange-400"
          >
            <option value="number">📋 Według numeru</option>
            <option value="oldest">⏰ Od najstarszych</option>
            <option value="newest">🆕 Od najnowszych</option>
          </select>
        </div>
      </div>

      <SearchBox
        placeholder="🔍 Szukaj centrali..."
        value={searchQuery}
        onChange={(e) => setSearchQuery(e.target.value)}
        onClear={() => setSearchQuery('')}
      />

      {defectEditor && <DefectDialog onClose={() => setDefectEditor(null)}>
        <AddDefect key={defectEditor.id || defectEditor.unitNumber} units={units} setUnits={setUnits} components={components} initialDefect={defectEditor.id ? defectEditor : null} initialUnitNumber={defectEditor.unitNumber} onDelete={() => handleDeleteDefect(defectEditor)} deleting={deletingId !== null} onDone={() => setDefectEditor(null)} />
      </DefectDialog>}
      <div className="space-y-2 md:space-y-3">
        {sortedUnits.map((unitNumber) => {
          const unitDefects = tempUnits.filter((u) => u.unitNumber === unitNumber);
          const completedCount = unitDefects.filter((u) => u.completed).length;
          const totalCount = unitDefects.length;

          return (
            <div key={unitNumber} className="border border-gray-200 rounded-lg overflow-hidden bg-white shadow-sm">
              <div className="flex items-center justify-between bg-gradient-to-r from-orange-500 to-red-500 px-3 py-1.5">
                <div className="flex items-center space-x-2">
                  <i className="fas fa-wind text-white text-sm"></i>
                  <h3 className="text-sm md:text-base font-bold text-white">{unitNumber}</h3>
                  <span className="text-xs text-white bg-white bg-opacity-20 px-1.5 py-0.5 rounded-full">
                    {completedCount}/{totalCount}
                  </span>
                </div>
                <div className="text-xs text-white">
                  <button className="mr-3 underline" onClick={() => setDefectEditor({unitNumber})}>+ Dodaj brak</button>
                  {totalCount} brak{totalCount !== 1 ? 'i' : ''}
                </div>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-xs">
                  <thead className="bg-gray-100 text-gray-700">
                    <tr>
                      <th className="px-2 py-1 text-left font-semibold">Komponent</th>
                      <th className="px-2 py-1 text-left font-semibold">Szczegóły</th>
                      <th className="px-2 py-1 text-center font-semibold">Status</th>
                      <th className="px-2 py-1 text-center font-semibold">Akcja</th>
                    </tr>
                  </thead>
                  <tbody>
                    {unitDefects.map((defect) => (
                      <tr key={defect.id} className="border-b border-gray-100 hover:bg-gray-50">
                        <td className="px-2 py-1.5 font-medium">
                          <i className="fas fa-cog text-orange-400 text-xs mr-1"></i>
                          {defect.component}
                          {defect.deliveryDate && <small className="block text-gray-600">Dostawa: {defect.deliveryDate.split('-').reverse().join('.')}</small>}
                        </td>
                        <td className="px-2 py-1.5 text-gray-600">
                          {Object.entries(defect.fields).map(([k, v]) => (
                            <span key={k} className="inline-block bg-gray-100 rounded px-1.5 py-0.5 text-xs mr-1 mb-0.5">
                              {k}: {v}
                            </span>
                          ))}

                          {/* Sekcja komentarza z edycją */}
                          <div className="mt-1">
                            {editingComment === defect.id ? (
                              <div className="space-y-1">
                                <AutoTextarea
                                  value={editCommentValue}
                                  onChange={(e) => setEditCommentValue(e.target.value)}
                                  className="w-full p-1 text-xs border rounded"
                                  rows="2"
                                  placeholder="Wpisz komentarz..."
                                />
                                <div className="flex space-x-1">
                                  <button
                                    onClick={() => handleSaveComment(defect.id)}

      // NOWY ULEPSZONE ARCHIWUM Z CHECKBOXAMI W NAGŁÓWKACH

        const handleUnitSelectionChange = (
          unitNumber,
          checked,
          type = 'delete'

          const unitsInView = archivedUnits.filter(
            (u) => u.unitNumber === unitNumber

          const selectedSet =
            type === 'delete' ? selectedForDeletion : selectedForRestore;
          const setSelected =
            type === 'delete' ? setSelectedForDeletion : setSelectedForRestore;

          const newSelection = new Set(selectedSet);

          unitsInView.forEach((unit) => {
            if (checked) {
              newSelection.add(unit.id);
            } else {
              newSelection.delete(unit.id);
            }
          });

          setSelected(newSelection);
        };

        const isUnitSelected = (unitNumber, type = 'delete') => {
          const unitsInView = archivedUnits.filter(
            (u) => u.unitNumber === unitNumber

          const selectedSet =
            type === 'delete' ? selectedForDeletion : selectedForRestore;

        return (

            {(selectedForDeletion.size > 0 || selectedForRestore.size > 0) && (

                              handleUnitSelectionChange(

                                !isUnitSelected(unitNumber, 'restore'),

                          <tbody>

                                  <i className="fas fa-cog mr-1 md:mr-2 text-orange-500"></i>
                                  <span className="text-xs md:text-sm">

                                  </span>
                                </td>
                                <td className="text-xs md:text-sm text-gray-600">
  {Object.entries(defect.fields).map(
    ([k, v]) => (

  )}
  {/* NOWE - pokaż komentarz w archiwum */}
  {defect.comment && (
    <div className="mt-2 p-2 bg-blue-50 rounded-lg border-l-4 border-blue-400">

      <p className="text-xs text-blue-700 mt-1">{defect.comment}</p>
    </div>
  )}
</td>

                                <td className="orientation-landscape-only text-xs text-gray-500">
                                  {new Date(

                                  {defect.dateCompleted
                                    ? new Date(
                                        defect.dateCompleted
                                      ).toLocaleDateString()
                                    : '-'}

                                <td>
                                  <button
                                    onClick={() => handleEdit(defect)}

                                    <i className="fas fa-edit text-sm"></i>
                                  </button>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>

            {filteredUnits.length === 0 && (
              <div className="text-center py-8 md:py-12">
                <i className="fas fa-archive text-4xl md:text-6xl text-gray-400 mb-4"></i>

                <p className="text-sm md:text-base text-gray-500">
                  {searchQuery

              </div>

            {editDefect && (
              <div className="modal-overlay">

      const Options = ({ components, setComponents }) => {
        const [newComponent, setNewComponent] = useState('');
        const [editing, setEditing] = useState(null);
        const [fields, setFields] = useState([]);
        const [fieldCount, setFieldCount] = useState(1);
        const [saving, setSaving] = useState(false);
        const mobile = isMobile();

        const handleAddComponent = async () => {
          if (!newComponent || fields.length !== fieldCount || saving) return;

          const name = newComponent.trim().replace(/\s+/g, ' ');
          if (!name) return;
          setSaving(true);
          try {
            const current = await window.dataManager.getData('components');
            if (current.some(c => c.id !== editing?.id && matchesComponent(c, name))) {
              showToast('Taki komponent już istnieje', 'error');
              return;
            }
            const componentData = { name, fields, aliases: editing ? [...new Set([editing.name, ...(editing.aliases || [])])] : [] };
            if (editing) {
              await window.dataManager.updateData('components', editing.id, componentData);
              setComponents(components.map(c => c.id === editing.id ? { ...c, ...componentData } : c));
              setEditing(null); setNewComponent(''); setFields([]); setFieldCount(1);
              showToast('Komponent zapisany. Dane braków i archiwum zachowane.', 'success');
              return;
            }
            const addedComponent = await window.dataManager.addData(
              'components',
              componentData
            );

            setComponents([...components, addedComponent]);
            setNewComponent('');
            setFields([]);
            setFieldCount(1);

            showToast('🎉 Komponent dodany pomyślnie!', 'success');
          } catch (error) {
            showToast('❌ Błąd dodawania komponentu', 'error');
          } finally {
            setSaving(false);
          }
        };

        const handleAddField = () => {
          if (fields.length < fieldCount) {
            setFields([...fields, { name: '', type: 'text' }]);
          }
        };

        const handleDeleteComponent = async (component) => {
          if (
            confirm(`Czy na pewno chcesz usunąć komponent "${component.name}"?`)
          ) {
            try {
              await window.dataManager.deleteData('components', component.id);
              setComponents(
                components.filter((comp) => comp.id !== component.id)
              );
              showToast('🗑️ Komponent usunięty pomyślnie!', 'success');
            } catch (error) {
              showToast('❌ Błąd usuwania komponentu', 'error');
            }
          }
        };

        return (
          <div className="glass-card">
            {editing && <div role="status">Edycja: {editing.name} <button disabled={saving} onClick={() => { setEditing(null); setNewComponent(''); setFields([]); setFieldCount(1); }}>Anuluj edycję</button></div>}
            <div className="flex items-center mb-6 md:mb-8">
              <div className="w-12 h-12 md:w-16 md:h-16 bg-gradient-to-br from-green-400 to-teal-500 rounded-xl md:rounded-2xl flex items-center justify-center mr-4 md:mr-6">
                <i className="fas fa-cog text-lg md:text-2xl text-white"></i>
              </div>
              <div>
                <h2 className="text-xl md:text-3xl font-bold text-gray-800">
                  Ustawienia
                </h2>
                <p className="text-sm md:text-base text-gray-600">
                  Zarządzaj komponentami systemu
                </p>
              </div>
            </div>

              <div>
                <h3 className="text-lg md:text-xl font-semibold mb-4 md:mb-6 flex items-center">

                    <input
                      type="text"
                      placeholder="np. Nagrzewnica"
                      value={newComponent}
                      onChange={(e) => setNewComponent(e.target.value)}
                      className="form-input"
                    />
                  </div>

                  <div className="space-y-2 md:space-y-3">
                    <label className="form-label">LICZBA PÓL</label>
                    <input
                      type="number"
                      min="1"
                      max="10"
                      placeholder="1"
                      value={fieldCount}
                      onChange={(e) =>
                        setFieldCount(parseInt(e.target.value) || 1)
                      }
                      className="form-input"
                    />
                  </div>
                </div>

                <div className="mt-4 md:mt-6 space-y-3 md:space-y-4">

                      key={i}

                        <label className="block text-xs md:text-sm font-medium text-gray-600">
                          Pole {i + 1}
                        </label>
                        <input
                          type="text"
                          placeholder={`Nazwa pola ${i + 1}`}

                          onChange={(e) => {
                            const newFields = [...fields];
                            newFields[i] = {
                              ...newFields[i],
                              name: e.target.value,
                            };
                            setFields(newFields);
                          }}
                          className="form-input"
                        />
                      </div>
                      <div className="w-full md:w-32 space-y-2">
                        <label className="block text-xs md:text-sm font-medium text-gray-600">
                          Typ

              </div>

              <div>
                <h3 className="text-lg md:text-xl font-semibold mb-4 md:mb-6 flex items-center">
                  <i className="fas fa-list mr-2 text-blue-500"></i>
                  Zarządzaj Komponentami
                </h3>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
                  {sortComponents(components).map((comp) => (
                    <div
                      key={comp.id}
                      className="bg-white border-2 border-gray-200 rounded-xl md:rounded-2xl p-4 md:p-6 hover:border-orange-300 hover:shadow-lg transition-all duration-300 transform hover:scale-105"
                    >
                      <div className="flex items-center justify-between mb-3 md:mb-4">
                        <div className="flex items-center">
                          <div className="w-8 h-8 md:w-10 md:h-10 bg-gradient-to-br from-orange-400 to-red-500 rounded-lg md:rounded-xl flex items-center justify-center mr-2 md:mr-3">
                            <i className="fas fa-cog text-white text-sm md:text-base"></i>
                          </div>
                          <h4 className="text-base md:text-lg font-bold text-gray-800">
                            {comp.name}
                          </h4>
                        </div>
                        <button
                          onClick={() => { setEditing(comp); setNewComponent(comp.name); setFields((comp.fields || []).map(f => ({ ...f }))); setFieldCount((comp.fields || []).length); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                          disabled={saving}
                          title="Edytuj komponent"
                          className="btn-primary"
                        >Edytuj</button>
                        <button
                          disabled={saving}
                          onClick={() => handleDeleteComponent(comp)}
                          className="text-red-500 hover:text-red-700 hover:bg-red-50 p-1 md:p-2 rounded-full transition-all duration-200"
                        >
                          <i className="fas fa-trash text-sm"></i>
                        </button>
                      </div>

                      <div className="space-y-2">
                        <p className="text-xs md:text-sm text-gray-600 font-medium">
                          Pola:
                        </p>
                        <div className="flex flex-wrap gap-1 md:gap-2">
                          {comp.fields.map((field, index) => (
                            <span
                              key={index}
                              className="inline-flex items-center px-2 md:px-3 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-800"
                            >
                              <i
                                className={`fas ${
                                  field.type === 'number'
                                    ? 'fa-hashtag'
                                    : field.type === 'email'
                                    ? 'fa-envelope'
                                    : field.type === 'date'
                                    ? 'fa-calendar'
                                    : 'fa-font'
                                } mr-1`}
                              ></i>
                              {field.name}
                            </span>
                          ))}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                {components.length === 0 && (
                  <div className="text-center py-8 md:py-12">
                    <i className="fas fa-cog text-4xl md:text-6xl text-gray-400 mb-4"></i>
                    <h3 className="text-lg md:text-xl font-semibold text-gray-600 mb-2">
                      Brak komponentów
                    </h3>
                    <p className="text-sm md:text-base text-gray-500">
                      Dodaj pierwszy komponent aby zacząć
                    </p>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      };

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
  </body>
</html>
